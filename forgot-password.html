<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - The BlackFlower</title>
    
    <!-- رابط كود الستايل الخارجي الخاص بك -->
    <link rel="stylesheet" href="css/style.css">
    
    <style>
        /* ستايلات مخصصة فقط للفورم تتماشى مع طابعك الفخم */
        .form-group {
            margin-bottom: 20px;
            width: 100%;
            max-width: 400px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .form-group input {
            width: 100%;
            padding: 12px;
            background-color: #000000;
            border: 1px solid #444444;
            color: #ffffff;
            font-family: inherit;
        }
        .form-group input:focus {
            outline: none;
            border-color: #ffffff;
        }
        .account-links {
            margin-top: 30px; 
            border-top: 1px dashed #333333; 
            padding-top: 20px;
            text-align: center;
            font-size: 0.9rem;
            line-height: 2;
        }
        .msg {
            margin-top: 20px;
            font-size: 0.9rem;
            text-align: center;
        }
    </style>
</head>
<body>

    <header class="main-header">
        <div class="header-container">
            <img src="logo.png" alt="BlackFlower Logo" class="header-logo">
            <div class="header-text-block">
                <div class="brand-title">The BlackFlower</div>
                <div class="brand-subtitle">Professional Art</div>
            </div>
        </div>
    </header>

    <div class="container">
        <h2 style="text-transform: uppercase; letter-spacing: 2px; margin-bottom: 10px;">Forgot Password</h2>
        <p style="color: #aaaaaa; margin-bottom: 40px; font-size: 0.9rem;">Enter your registered email to receive password reset instructions.</p>
        
        <form id="forgot-password-form" style="width: 100%; max-width: 400px; display: flex; flex-direction: column; align-items: center;">
            <div class="form-group">
                <label for="reset-email">Email Address</label>
                <input type="email" id="reset-email" placeholder="name@example.com" required>
            </div>

            <div class="auth-buttons-container" style="margin-top: 20px; width: 100%;">
                <button type="submit" id="reset-btn" class="btn-blackflower" style="width: 100%;">Send Reset Instructions</button>
            </div>
        </form>

        <div class="account-links">
            <p>Remembered your password? <a href="login.html">Login here</a></p>
            <p>Don't have an account? <a href="register.html">Create New Account</a></p>
        </div>

        <p id="response-message" class="msg" style="display: none;"></p>
    </div>

    <script>
        const API_URL = 'http://localhost:5000/api';

        document.getElementById('forgot-password-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const emailInput = document.getElementById('reset-email').value.trim();
            const resetBtn = document.getElementById('reset-btn');
            const responseMsg = document.getElementById('response-message');

            resetBtn.disabled = true;
            resetBtn.textContent = "SENDING...";
            responseMsg.style.display = 'none';

            try {
                const response = await fetch(`${API_URL}/forgot-password`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email: emailInput })
                });

                const result = await response.json();

                responseMsg.style.display = 'block';
                if (result.success) {
                    responseMsg.style.color = '#00ff77';
                    responseMsg.textContent = result.message || "Reset instructions have been sent to your email.";
                    document.getElementById('forgot-password-form').reset();
                } else {
                    responseMsg.style.color = '#ff4444';
                    responseMsg.textContent = result.message || "Failed to process request. Please check your email.";
                }

            } catch (error) {
                console.error("Error:", error);
                responseMsg.style.display = 'block';
                responseMsg.style.color = '#ff4444';
                responseMsg.textContent = "Connection error with local server.";
            } finally {
                resetBtn.disabled = false;
                resetBtn.textContent = "Send Reset Instructions";
            }
        });
    </script>
</body>
</html>
