<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مشاهدة الإعلان</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #121212; color: #fff; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        .top-bar { background: #1e1e1e; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; }
        .timer-box { font-size: 18px; color: #d4af37; font-weight: bold; }
        .frame-container { flex: 1; position: relative; width: 100%; height: 100%; }
        iframe { width: 100%; height: 100%; border: none; }
        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 10; }
        .overlay h2 { color: #d4af37; font-size: 28px; margin-bottom: 10px; }
        .btn { background: #d4af37; color: #121212; border: none; padding: 10px 20px; border-radius: 4px; font-weight: bold; cursor: pointer; margin-top: 15px; display: none; }
    </style>
</head>
<body>

    <div class="top-bar">
        <span>جاري مشاهدة الإعلان الترويجي...</span>
        <div class="timer-box" id="timer">الرجاء الانتظار: <span id="countdown">--</span> ثانية</div>
    </div>

    <div class="frame-container">
        <!-- شاشة سوداء مع العداد وزر العودة -->
        <div class="overlay" id="overlay">
            <h2 id="statusText">جاري تجهيز الإعلان...</h2>
            <div id="counterDisplay" style="font-size: 40px; color: #fff; font-weight: bold;">--</div>
            <button class="btn" id="backBtn" onclick="finishAd()">العودة إلى لوحة التحكم</button>
        </div>
        
        <iframe id="adFrame" src=""></iframe>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const adUrl = urlParams.get('url');
        let duration = parseInt(urlParams.get('duration')) || 10;

        document.getElementById('adFrame').src = adUrl;
        
        let timeLeft = duration;
        const countdownEl = document.getElementById('countdown');
        const counterDisplay = document.getElementById('counterDisplay');
        const statusText = document.getElementById('statusText');
        const backBtn = document.getElementById('backBtn');
        const overlay = document.getElementById('overlay');

        counterDisplay.textContent = timeLeft;
        countdownEl.textContent = timeLeft;

        const timer = setInterval(() => {
            timeLeft--;
            counterDisplay.textContent = timeLeft;
            countdownEl.textContent = timeLeft;

            if (timeLeft <= 0) {
                clearInterval(timer);
                statusText.textContent = 'تمت مشاهدة الإعلان بنجاح!';
                counterDisplay.style.display = 'none';
                overlay.style.background = 'rgba(0,0,0,0.7)';
                backBtn.style.display = 'block';
                
                // هنا يتم تحديث رصيد المستخدم وزيادة عدد الإعلانات المشاهدة في قاعدة البيانات إذا أردت
            }
        }, 1000);

        function finishAd() {
            window.location.href = 'dashboard.html';
        }
    </script>
</body>
</html>
