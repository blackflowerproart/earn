<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Task Responses - The BlackFlower</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .manage-panel {
            border: 2px solid #ffffff;
            background-color: #000000;
            padding: 30px;
            margin-top: 30px;
        }
        .task-title-header {
            color: #ff00ff;
            text-transform: uppercase;
            border-bottom: 1px dashed #333;
            padding-bottom: 15px;
            margin-bottom: 25px;
        }
        .submission-card {
            border: 1px solid #333;
            background: #050505;
            padding: 20px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .submission-info {
            color: #ccc;
        }
        .submission-info span {
            color: #888;
            font-size: 0.85rem;
            display: block;
            margin-bottom: 5px;
        }
        .action-buttons {
            display: flex;
            gap: 10px;
        }
        .btn-accept {
            background: #000;
            border: 1px solid #00ff77;
            color: #00ff77;
            padding: 8px 15px;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-accept:hover { background: #00ff77; color: #000; }
        .btn-reject {
            background: #000;
            border: 1px solid #ff0055;
            color: #ff0055;
            padding: 8px 15px;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-reject:hover { background: #ff0055; color: #000; }
    </style>
</head>
<body>

    <header class="main-header">
        <div class="header-container">
            <img src="logo.png" alt="BlackFlower Logo" class="header-logo">
            <div class="header-text-block">
                <div class="brand-title">The BlackFlower</div>
                <div class="brand-subtitle">Task Review Dashboard</div>
            </div>
        </div>
    </header>

    <div class="container">
        <button onclick="window.location.href='tasks.html'" class="btn-blackflower" style="margin-top:20px;">⬅️ Back to Tasks</button>
        
        <div class="manage-panel">
            <h2 id="main-task-title" class="task-title-header">Loading Task Details...</h2>
            
            <h3>📥 User Submissions</h3>
            <div id="submissions-container">
                <p style="color: #555;">Checking for responses...</p>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:5000/api';

        // الحصول على معرف المهمة id من الـ URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const taskId = urlParams.get('id');
        let currentUser = null;

        document.addEventListener('DOMContentLoaded', () => {
            const savedUser = localStorage.getItem('user');
            if (!savedUser) {
                alert('Please login first');
                window.location.href = 'login.html';
                return;
            }
            currentUser = JSON.parse(savedUser);

            if(!taskId) {
                alert("No Task ID provided.");
                window.location.href = 'tasks.html';
                return;
            }
            getTaskDetails();
            loadSubmissions();
        });

        // جلب اسم المهمة من السيرفر
        async function getTaskDetails() {
            try {
                const response = await fetch(`${API_URL}/task-details?id=${taskId}`);
                const result = await response.json();
                
                if (result.success && result.task) {
                    document.getElementById('main-task-title').innerText = `⚙️ Managing: ${result.task.title}`;
                } else {
                    document.getElementById('main-task-title').innerText = `⚙️ Task Management`;
                }
            } catch (err) {
                console.error("Error fetching task details:", err);
            }
        }

        // جلب الردود المعلقة للمراجعة من السيرفر المحلي (MongoDB)
        async function loadSubmissions() {
            const container = document.getElementById('submissions-container');
            
            try {
                const response = await fetch(`${API_URL}/task-submissions?task_id=${taskId}&status=pending`);
                const result = await response.json();

                if (!result.success || !result.submissions || result.submissions.length === 0) {
                    container.innerHTML = '<p style="color:#666;">No pending submissions to review for this task.</p>';
                    return;
                }

                container.innerHTML = '';
                result.submissions.forEach(sub => {
                    const card = document.createElement('div');
                    card.className = 'submission-card';
                    card.innerHTML = `
                        <div class="submission-info">
                            <span>User Email: ${sub.user_email || sub.user_id}</span>
                            <p><strong>Proof/Text:</strong> ${sub.proof_text || 'No description provided.'}</p>
                            ${sub.proof_image || sub.screenshot_url ? `<a href="${sub.proof_image || sub.screenshot_url}" target="_blank" style="color:#ff00ff; font-size:0.9rem;">🖼️ View Proof Screenshot</a>` : ''}
                        </div>
                        <div class="action-buttons">
                            <button class="btn-accept" onclick="updateStatus('${sub._id || sub.id}', 'approved')">✔️ Accept</button>
                            <button class="btn-reject" onclick="updateStatus('${sub._id || sub.id}', 'rejected')">❌ Reject</button>
                        </div>
                    `;
                    container.appendChild(card);
                });
            } catch (error) {
                console.error("Error loading submissions:", error);
                container.innerHTML = '<p style="color:#ff4444;">Error loading submissions from server.</p>';
            }
        }

        // تحديث حالة الرد (قبول أو رفض) عبر الـ API
        async function updateStatus(submissionId, newStatus) {
            try {
                const response = await fetch(`${API_URL}/update-submission`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        submission_id: submissionId,
                        status: newStatus
                    })
                });

                const result = await response.json();

                if (!result.success) {
                    throw new Error(result.message || "Error updating status");
                }

                alert(`Submission ${newStatus} successfully!`);
                loadSubmissions(); // إعادة تحميل القائمة

            } catch (error) {
                alert("Error: " + error.message);
            }
        }
    </script>
</body>
</html>
