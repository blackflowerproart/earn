<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - The BlackFlower</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .dashboard-container {
            max-width: 800px;
            margin: 40px auto;
            border: 2px solid #ffffff;
            background-color: #000000;
            padding: 30px;
            text-align: center;
        }
        .dashboard-container h1 {
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }
        .welcome-msg {
            color: #00ff77;
            font-size: 1.2rem;
            margin-bottom: 30px;
            font-family: monospace;
        }
        .dashboard-actions {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 30px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="dashboard-container">
            <h1>Control Panel</h1>
            <div id="welcomeUser" class="welcome-msg">Welcome back!</div>
            
            <p style="color: #aaa; margin-bottom: 20px;">Manage your tasks, create new advertising campaigns, and control your activities from here.</p>

            <div class="dashboard-actions">
                <button onclick="window.location.href='tasks.html'" class="btn-blackflower" style="border-color: #00ff77; color: #00ff77;">📋 Manage My Tasks</button>
                <button onclick="logout()" class="btn-blackflower" style="border-color: #ff4444; color: #ff4444;">🚪 Logout</button>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const savedUser = localStorage.getItem('user');
            if (!savedUser) {
                alert('Please login first');
                window.location.href = 'login.html';
                return;
            }

            const user = JSON.parse(savedUser);
            document.getElementById('welcomeUser').innerText = `Welcome, ${user.username || user.email}!`;
        });

        function logout() {
            localStorage.removeItem('user');
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
