<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - Black Flower Pro Art</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #121212; color: #fff; margin: 0; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; padding-bottom: 15px; }
        .header h1 { color: #d4af37; margin: 0; font-size: 22px; }
        .logout-btn { background: #d32f2f; color: #fff; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-top: 20px; }
        .card { background: #1e1e1e; padding: 20px; border-radius: 8px; border-top: 4px solid #d4af37; box-shadow: 0 2px 5px rgba(0,0,0,0.3); }
        .card h3 { margin: 0 0 10px 0; font-size: 16px; color: #aaa; }
        .card .value { font-size: 24px; font-weight: bold; color: #fff; }
    </style>
</head>
<body>

    <div class="header">
        <h1 id="welcomeText">مرحباً بك</h1>
        <button class="logout-btn" onclick="logout()">تسجيل الخروج</button>
    </div>

    <div class="grid">
        <div class="card">
            <h3>الرصيد الحالي</h3>
            <div class="value" id="balance">0.00 BFP</div>
        </div>
        <div class="card">
            <h3>المستوى</h3>
            <div class="value" id="level">1</div>
        </div>
        <div class="card">
            <h3>المهام المنجزة</h3>
            <div class="value" id="tasksDone">0</div>
        </div>
        <div class="card">
            <h3>الإعلانات المشاهدة</h3>
            <div class="value" id="adsViewed">0</div>
        </div>
        <div class="card">
            <h3>الدولة</h3>
            <div class="value" id="country">Jordan (Amman)</div>
        </div>
        <div class="card">
            <h3>عدد مرات الدخول</h3>
            <div class="value" id="loginCount">0</div>
        </div>
    </div>

    <script>
        // التحقق من وجود المستخدم مسجل الدخول
        const userStr = localStorage.getItem('currentUser');
        if (!userStr) {
            window.location.href = 'login.html';
        }

        const user = JSON.parse(userStr);

        // تعبئة البيانات في الواجهة من ملف الـ JSON القادم من MongoDB
        document.getElementById('welcomeText').textContent = `مرحباً بك، ${user.username}`;
        
        const dbData = user.dashboardData || {};
        document.getElementById('balance').textContent = `${(dbData.balance || 0).toFixed(2)} BFP`;
        document.getElementById('level').textContent = dbData.level || 1;
        document.getElementById('tasksDone').textContent = dbData.tasksDone || 0;
        document.getElementById('adsViewed').textContent = dbData.adsViewed || 0;
        document.getElementById('country').textContent = dbData.country || 'Jordan (Amman)';
        document.getElementById('loginCount').textContent = dbData.loginCount || 1;

        function logout() {
            localStorage.removeItem('currentUser');
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
