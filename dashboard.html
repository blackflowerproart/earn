<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Dashboard - The BlackFlower Pro Art</title>
    <!-- ربط ملف التصميم الخارجي -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="dashboard-container">
        <!-- إشعار الرسائل الواردة من المدير التنفيذي -->
        <div id="adminNotification" class="notification-banner">
            <strong>[System / Executive Notice]:</strong> <span id="notificationText"></span>
        </div>

        <div class="dash-header">
            <div>
                <h1 id="welcomeUser">Welcome, User</h1>
                <span style="color: #888; font-size: 0.75rem;" id="userEmail">email@domain.com</span>
            </div>
            <div>
                <button class="btn" onclick="openInboxModal()">Inbox & Outbox</button>
                <button class="btn" onclick="logout()" style="border-color: #ff3333; color: #ff3333;">Logout</button>
            </div>
        </div>

        <!-- شريط تقدم المستويات الرسومي -->
        <div class="level-container">
            <div class="level-info">
                <span>Current Tier: <strong id="currentLevelText">Level 1</strong></span>
                <span id="nextLevelProgressText">0% to Level 2</span>
            </div>
            <div class="progress-bar-bg">
                <div id="levelProgressBar" class="progress-bar-fill"></div>
            </div>
        </div>

        <div class="dash-grid">
            <div class="dash-card">
                <h3>Available Balance</h3>
                <div class="val" id="userBalance">0.00 BFP</div>
            </div>
            <div class="dash-card">
                <h3>Total Tasks Done</h3>
                <div class="val" id="userTasks">0</div>
            </div>
            <div class="dash-card">
                <h3>Ads Viewed</h3>
                <div class="val" id="userAds">0</div>
            </div>
        </div>
    </div>

    <!-- Modal البريد الوارد والصادر والمراسلة -->
    <div id="inboxModal" class="modal">
        <div class="modal-content">
            <h2>Internal Messaging System</h2>
            <div style="margin-bottom: 15px; max-height: 200px; overflow-y:auto; border: 1px solid #333; padding: 10px;" id="messagesBox">
                <p style="color: #666; font-size: 0.8rem;">No messages yet.</p>
            </div>
            <form id="sendMessageForm">
                <div class="form-group">
                    <label>Send Message to Member / Admin</label>
                    <textarea id="msgContent" required placeholder="Write your message here..."></textarea>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn" onclick="closeInboxModal()">Close</button>
                    <button type="submit" class="btn" style="background:#fff; color:#000; font-weight:bold;">Send Message</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const API_URL = 'https://earn-uq8k.onrender.com/api';

        document.addEventListener('DOMContentLoaded', () => {
            loadUserData();
            checkNotifications();
        });

        function loadUserData() {
            // جلب بيانات المستخدم المخزنة محلياً بعد تسجيل الدخول
            const user = JSON.parse(localStorage.getItem('currentUser')) || {
                username: 'Demo User',
                email: 'user@blackflower.art',
                balance: 15.50,
                level: 2,
                tasksDone: 12,
                adsViewed: 45
            };

            document.getElementById('welcomeUser').innerText = `Welcome, ${user.username}`;
            document.getElementById('userEmail').innerText = user.email;
            document.getElementById('userBalance').innerText = `${user.balance.toFixed(2)} BFP`;
            document.getElementById('userTasks').innerText = user.tasksDone || 0;
            document.getElementById('userAds').innerText = user.adsViewed || 0;

            // تحديث شريط المستويات الرسومي (افتراض كل مستوى يحتاج 10 مستويات أو نسب معينة)
            const currentLvl = user.level || 1;
            document.getElementById('currentLevelText').innerText = `Level ${currentLvl}`;
            
            // حساب نسبة تقدم افتراضية للمستوى (مثلاً بناءً على المهام)
            const progressPercent = Math.min(((user.tasksDone % 10) * 10), 100);
            document.getElementById('levelProgressBar').style.width = `${progressPercent}%`;
            document.getElementById('nextLevelProgressText').innerText = `${progressPercent}% to Level ${currentLvl + 1}`;
        }

        function checkNotifications() {
            // محاكاة جلب إشعار مرسل من المدير التنفيذي
            const notice = localStorage.getItem('executiveNotice');
            if (notice) {
                document.getElementById('notificationText').innerText = notice;
                document.getElementById('adminNotification').classList.add('active');
            }
        }

        function openInboxModal() {
            document.getElementById('inboxModal').style.display = 'flex';
        }

        function closeInboxModal() {
            document.getElementById('inboxModal').style.display = 'none';
        }

        document.getElementById('sendMessageForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const text = document.getElementById('msgContent').value;
            alert('Message sent successfully through the internal network!');
            document.getElementById('msgContent').value = '';
            closeInboxModal();
        });

        function logout() {
            localStorage.removeItem('currentUser');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
