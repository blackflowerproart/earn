<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - The Black Flower Pro Art</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- الشريط العلوي الموحد الثابت -->
    <header class="site-header">
        <div class="header-left">
            <img src="black.jpg" alt="Logo" class="site-logo">
            <span class="brand-title">The Black Flower</span>
        </div>
        <div class="header-right">
            <span>Professional Art</span>
        </div>
    </header>

    <div class="dashboard-container">
        <div id="adminNotification" class="notification-banner">
            <strong>[System / Executive Notice]:</strong> <span id="notificationText"></span>
        </div>

        <div class="dash-header">
            <div>
                <h1 id="welcomeUser">Welcome, User</h1>
                <span style="color: #888; font-size: 0.75rem;" id="userEmail">user@domain.com</span>
            </div>
            <div>
                <button class="btn" style="width: auto; margin-top: 0; display: inline-block;" onclick="openInboxModal()">Inbox</button>
                <button class="btn" style="width: auto; margin-top: 0; display: inline-block; border-color: #ff3333; color: #ff3333;" onclick="logout()">Logout</button>
            </div>
        </div>

        <!-- شريط تقدم المستويات الرسومي -->
        <div class="level-container">
            <div class="level-info">
                <span>Current Tier: <strong id="currentLevelText">Level 1</strong></span>
                <span id="nextLevelProgressText">0% to Level 2</span>
            </div>
            <div class="progress-bar-bg">
                <div id="levelProgressBar" class="progress-bar-fill"></div>
            </div>
        </div>

        <div class="dash-grid">
            <div class="dash-card">
                <h3>Available Balance</h3>
                <div class="val" id="userBalance">0.00 BFP</div>
            </div>
            <div class="dash-card">
                <h3>Total Tasks Done</h3>
                <div class="val" id="userTasks">0</div>
            </div>
            <div class="dash-card">
                <h3>Ads Viewed</h3>
                <div class="val" id="userAds">0</div>
            </div>
        </div>
    </div>

    <!-- Modal البريد الوارد والصادر -->
    <div id="inboxModal" class="modal">
        <div class="modal-content">
            <h2>Internal Messaging System</h2>
            <div style="margin-bottom: 15px; max-height: 180px; overflow-y:auto; border: 1px solid #333; padding: 10px;" id="messagesBox">
                <p style="color: #666; font-size: 0.8rem;">No messages yet.</p>
            </div>
            <form id="sendMessageForm">
                <div class="form-group">
                    <label>Send Message</label>
                    <textarea id="msgContent" required placeholder="Write your message..."></textarea>
                </div>
                <div style="display: flex; gap: 10px;">
                    <button type="button" class="btn" onclick="closeInboxModal()" style="border-color:#555;">Close</button>
                    <button type="submit" class="btn" style="background:#fff; color:#000; font-weight:bold;">Send</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            loadUserData();
            checkNotifications();
        });

        function loadUserData() {
            const user = JSON.parse(localStorage.getItem('currentUser')) || {
                username: 'Demo Member',
                email: 'member@blackflower.art',
                balance: 0.00,
                level: 1,
                tasksDone: 0,
                adsViewed: 0
            };

            document.getElementById('welcomeUser').innerText = `Welcome, ${user.username}`;
            document.getElementById('userEmail').innerText = user.email;
            document.getElementById('userBalance').innerText = `${(user.balance || 0).toFixed(2)} BFP`;
            document.getElementById('userTasks').innerText = user.tasksDone || 0;
            document.getElementById('userAds').innerText = user.adsViewed || 0;

            const currentLvl = user.level || 1;
            document.getElementById('currentLevelText').innerText = `Level ${currentLvl}`;
            const progressPercent = Math.min((((user.tasksDone || 0) % 10) * 10), 100);
            document.getElementById('levelProgressBar').style.width = `${progressPercent}%`;
            document.getElementById('nextLevelProgressText').innerText = `${progressPercent}% to Level ${currentLvl + 1}`;
        }

        async function checkNotifications() {
            try {
                const res = await fetch('https://earn-uq8k.onrender.com/api/notifications');
                const data = await res.json();
                if (data.success && data.notifications.length > 0) {
                    document.getElementById('notificationText').innerText = data.notifications[0].message;
                    document.getElementById('adminNotification').classList.add('active');
                }
            } catch (e) {
                console.error('Error fetching notifications');
            }
        }

        function openInboxModal() { document.getElementById('inboxModal').style.display = 'flex'; }
        function closeInboxModal() { document.getElementById('inboxModal').style.display = 'none'; }

        document.getElementById('sendMessageForm').addEventListener('submit', (e) => {
            e.preventDefault();
            alert('Message sent successfully!');
            document.getElementById('msgContent').value = '';
            closeInboxModal();
        });

        function logout() {
            localStorage.removeItem('currentUser');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
