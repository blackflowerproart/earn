<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Tasks Hub - The BlackFlower</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .tasks-wrapper {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 30px;
            margin-top: 30px;
            width: 100%;
        }
        .tasks-panel {
            border: 2px solid #ffffff;
            background-color: #000000;
            padding: 25px;
        }
        .tasks-panel h2 {
            text-transform: uppercase;
            letter-spacing: 2px;
            border-bottom: 1px dashed #333;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        .task-card {
            border: 1px solid #333;
            background: #050505;
            padding: 20px;
            margin-bottom: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .task-card:hover {
            border-color: #00ff77;
            background: #0a0a0a;
        }
        .task-card h4 {
            margin: 0;
            font-size: 1.3rem;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 15px;
        }
        .form-group label {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: bold;
        }
        .form-group input, .form-group textarea {
            background: #000;
            border: 1px solid #fff;
            color: #fff;
            padding: 10px;
            font-family: inherit;
        }
        .form-group input:focus, .form-group textarea:focus {
            outline: none;
            border-color: #ff00ff;
        }
        .form-control-file {
            background-color: #000000;
            color: #aaaaaa;
            padding: 10px;
            cursor: pointer;
            border: 1px dashed #333;
        }
        .live-calc {
            background: #111;
            padding: 15px;
            border: 1px dashed #333;
            margin-top: 15px;
            font-family: monospace;
            font-size: 1rem;
        }
        .live-calc span {
            color: #ff00ff;
            font-weight: bold;
        }
        @media (max-width: 900px) {
            .tasks-wrapper {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <header class="main-header">
        <div class="header-container">
            <img src="logo.png" alt="BlackFlower Logo" class="header-logo">
            <div class="header-text-block">
                <div class="brand-title">The BlackFlower</div>
                <div class="brand-subtitle">My Created Tasks</div>
            </div>
        </div>
    </header>

    <div class="container" style="max-width: 100%; padding: 0 20px;">
        
        <button onclick="window.location.href='dashboard.html'" class="btn-blackflower" style="margin-top:20px; min-width: 150px;">🏠 Back to Dashboard</button>

        <div class="tasks-wrapper">
            
            <div class="tasks-panel">
                <h2>📋 My Created Tasks</h2>
                <div id="available-tasks-container">
                    <p style="color:#555;">Loading your tasks...</p>
                </div>
            </div>

            <div class="tasks-panel">
                <h2>📢 Create New Task</h2>
                <form id="taskForm">
                    <div class="form-group">
                        <label for="taskTitle">Task Title</label>
                        <input type="text" id="taskTitle" placeholder="e.g., SUBSCRIBE TO MY CHANNEL" required>
                    </div>

                    <div class="form-group">
                        <label for="taskDetails">Task Details / Instructions</label>
                        <textarea id="taskDetails" rows="4" placeholder="DESCRIBE THE STEPS REQUIRED..." required></textarea>
                    </div>

                    <div class="form-group">
                        <label for="taskUrl">Target Website URL</label>
                        <input type="url" id="taskUrl" placeholder="https://example.com" required>
                    </div>

                    <div class="form-group">
                        <label for="taskDays">Duration (Days)</label>
                        <input type="number" id="taskDays" min="1" value="1" required>
                    </div>

                    <div class="form-group">
                        <label for="taskMedia">Explanation Media (Image / Video)</label>
                        <input type="file" id="taskMedia" class="form-control-file" accept="image/*,video/*">
                    </div>

                    <div class="live-calc">
                        Total Task Cost: <span id="totalCost">$0.50</span>
                    </div>

                    <button type="submit" id="submitBtn" class="btn-blackflower" style="width: 100%; margin-top: 15px; border-color: #00ff77; color: #00ff77;">🚀 Publish Task</button>
                </form>
            </div>

        </div>
    </div>

    <script>
        const API_URL = 'https://earn-uq8k.onrender.com/api';
        const pricePerDay = 0.50;
        const taskDaysInput = document.getElementById('taskDays');
        const totalCostSpan = document.getElementById('totalCost');
        let currentUser = null;

        taskDaysInput.addEventListener('input', () => {
            const days = parseInt(taskDaysInput.value) || 0;
            totalCostSpan.innerText = `$${(days * pricePerDay).toFixed(2)}`;
        });

        document.addEventListener('DOMContentLoaded', () => {
            const savedUser = localStorage.getItem('user');
            if (!savedUser) {
                alert('Please login first');
                window.location.href = 'login.html';
                return;
            }
            currentUser = JSON.parse(savedUser);

            loadActiveTasks();
            document.getElementById('taskForm').addEventListener('submit', handlePublishTask);
        });

        async function loadActiveTasks() {
            const container = document.getElementById('available-tasks-container');
            
            try {
                const response = await fetch(`${API_URL}/tasks?user_id=${currentUser.id || currentUser._id}`);
                const result = await response.json();

                if (!result.success || !result.tasks || result.tasks.length === 0) {
                    container.innerHTML = '<p style="color:#666;">You haven\'t created any tasks yet.</p>';
                    return;
                }

                container.innerHTML = '';
                result.tasks.forEach(task => {
                    const card = document.createElement('div');
                    card.className = 'task-card';
                    card.onclick = () => {
                        window.location.href = `manage-task.html?id=${task._id || task.id}`;
                    };
                    card.innerHTML = `<h4>📌 ${task.title}</h4>`;
                    container.appendChild(card);
                });
            } catch (error) {
                console.error("Error loading tasks:", error);
                container.innerHTML = '<p style="color:#ff4444;">Error connecting to server.</p>';
            }
        }

        async function handlePublishTask(e) {
            e.preventDefault();
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.innerText = "PUBLISHING...";

            const title = document.getElementById('taskTitle').value;
            const details = document.getElementById('taskDetails').value;
            const url = document.getElementById('taskUrl').value;
            const days = parseInt(taskDaysInput.value);
            const mediaFile = document.getElementById('taskMedia').files[0];

            try {
                const formData = new FormData();
                formData.append('user_id', currentUser.id || currentUser._id);
                formData.append('title', title);
                formData.append('details', details);
                formData.append('target_url', url);
                formData.append('price', pricePerDay * days);
                formData.append('duration_days', days);
                
                if (mediaFile) {
                    formData.append('media', mediaFile);
                }

                const response = await fetch(`${API_URL}/tasks`, {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();

                if (!result.success) {
                    throw new Error(result.message || "Failed to create task");
                }

                alert("Task created successfully!");
                document.getElementById('taskForm').reset();
                totalCostSpan.innerText = "$0.50";
                loadActiveTasks(); 

            } catch (error) {
                alert("Error: " + error.message);
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = "🚀 Publish Task";
            }
        }
    </script>
</body>
</html>
