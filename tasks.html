<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tasks & Ads - The BlackFlower Pro Art</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: monospace, sans-serif; }
        body { background-color: #000; color: #fff; }
        .container { max-width: 1100px; margin: 30px auto; padding: 0 20px; }
        .header-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #fff; padding-bottom: 15px; margin-bottom: 30px; }
        .header-bar h1 { text-transform: uppercase; font-size: 1.4rem; letter-spacing: 2px; }
        .btn-back { background: #fff; color: #000; padding: 8px 15px; text-decoration: none; text-transform: uppercase; font-size: 0.75rem; font-weight: bold; }
        
        .task-form-card { border: 2px solid #fff; padding: 25px; margin-bottom: 30px; background: #000; }
        .task-form-card h2 { text-transform: uppercase; font-size: 1.1rem; margin-bottom: 20px; letter-spacing: 1px; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .form-group { margin-bottom: 15px; }
        .form-group.full { grid-column: span 2; }
        label { display: block; font-size: 0.75rem; text-transform: uppercase; margin-bottom: 5px; color: #aaa; }
        input, textarea { width: 100%; background: #000; border: 1px solid #fff; color: #fff; padding: 10px; font-size: 0.9rem; outline: none; }
        textarea { resize: vertical; height: 80px; }
        .btn-submit { background: #fff; color: #000; border: 1px solid #fff; padding: 12px 20px; font-weight: bold; text-transform: uppercase; cursor: pointer; width: 100%; margin-top: 10px; }
        .btn-submit:hover { background: #000; color: #fff; }

        .tasks-list-section h2 { text-transform: uppercase; font-size: 1.1rem; margin-bottom: 15px; letter-spacing: 1px; }
        .task-card { border: 1px solid #fff; padding: 20px; margin-bottom: 15px; background: #050505; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; }
        .task-info h3 { text-transform: uppercase; font-size: 1rem; margin-bottom: 5px; }
        .task-info p { color: #aaa; font-size: 0.85rem; margin-bottom: 8px; }
        .task-price { color: #fff; font-weight: bold; font-size: 1rem; }
        .btn-action { background: #000; color: #fff; border: 1px solid #fff; padding: 8px 15px; text-decoration: none; text-transform: uppercase; font-size: 0.75rem; transition: 0.3s; }
        .btn-action:hover { background: #fff; color: #000; }

        @media (max-width: 768px) { .form-grid { grid-template-columns: 1fr; } .form-group.full { grid-column: span 1; } }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-bar">
            <h1>Task Management</h1>
            <a href="dashboard.html" class="btn-back">&larr; Dashboard</a>
        </div>

        <div class="task-form-card">
            <h2>Create New Task / Ad</h2>
            <form id="taskForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label>Task Title</label>
                        <input type="text" id="title" required>
                    </div>
                    <div class="form-group">
                        <label>Reward (BFP)</label>
                        <input type="number" step="0.01" id="price" required>
                    </div>
                    <div class="form-group full">
                        <label>Details & Instructions</label>
                        <textarea id="details" required></textarea>
                    </div>
                    <div class="form-group">
                        <label>Target URL</label>
                        <input type="url" id="target_url" required>
                    </div>
                    <div class="form-group">
                        <label>Duration (Days)</label>
                        <input type="number" id="duration_days" value="7" required>
                    </div>
                </div>
                <button type="submit" class="btn-submit">Publish Task</button>
            </form>
            <div id="formMsg" style="margin-top: 10px; font-size: 0.85rem;"></div>
        </div>

        <div class="tasks-list-section">
            <h2>Active Community Tasks</h2>
            <div id="tasksContainer">
                <p style="color: #666; font-size: 0.9rem;">Loading tasks...</p>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'https://earn-uq8k.onrender.com/api';

        document.addEventListener('DOMContentLoaded', () => {
            const savedUser = localStorage.getItem('user');
            if (!savedUser) {
                window.location.href = 'login.html';
                return;
            }
            fetchTasks();

            document.getElementById('taskForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const user = JSON.parse(savedUser);
                const msg = document.getElementById('formMsg');

                const taskData = {
                    user_id: user.id || user._id,
                    title: document.getElementById('title').value,
                    details: document.getElementById('details').value,
                    target_url: document.getElementById('target_url').value,
                    price: document.getElementById('price').value,
                    duration_days: document.getElementById('duration_days').value
                };

                msg.innerText = 'Publishing task...';

                try {
                    const res = await fetch(`${API_URL}/tasks`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(taskData)
                    });
                    const data = await res.json();
                    if (res.ok && data.success) {
                        msg.innerText = 'Task published successfully!';
                        document.getElementById('taskForm').reset();
                        fetchTasks();
                    } else {
                        msg.innerText = data.message || 'Failed to create task.';
                    }
                } catch (err) {
                    msg.innerText = 'Server connection error.';
                }
            });
        });

        async function fetchTasks() {
            try {
                const res = await fetch(`${API_URL}/tasks`);
                const data = await res.json();
                const container = document.getElementById('tasksContainer');

                if (data.success && data.tasks.length > 0) {
                    container.innerHTML = data.tasks.map(task => `
                        <div class="task-card">
                            <div class="task-info">
                                <h3>${escapeHtml(task.title)}</h3>
                                <p>${escapeHtml(task.details)}</p>
                                <span class="task-price">Reward: ${task.price} BFP</span>
                            </div>
                            <a href="${escapeHtml(task.target_url)}" target="_blank" class="btn-action">Start Task &rarr;</a>
                        </div>
                    `).join('');
                } else {
                    container.innerHTML = '<p style="color: #666; font-size: 0.9rem;">No active tasks found.</p>';
                }
            } catch (err) {
                document.getElementById('tasksContainer').innerHTML = '<p style="color: #666;">Error loading tasks.</p>';
            }
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
