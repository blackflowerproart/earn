<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Watch Ads - Earn BFP</title>
    <style>
        * { box-sizing: border-box; font-family: monospace, sans-serif; margin: 0; padding: 0; }
        body { background: #000; color: #fff; padding: 20px; text-align: center; }
        .ad-box { border: 2px solid #fff; padding: 40px; margin: 30px auto; max-width: 500px; }
        .btn { background: #fff; color: #000; padding: 12px 25px; border: none; font-weight: bold; cursor: pointer; }
        .btn:disabled { background: #444; cursor: not-allowed; }
        #timer { margin-top: 15px; font-size: 1.2rem; }
    </style>
</head>
<body>
    <h1>مشاهدة الإعلانات المطروحة</h1>
    <div class="ad-box">
        <h3>إعلان راعي المشروع: BlackFlower Art</h3>
        <p style="margin: 15px 0; color: #aaa;">شاهد الإعلان لمدة 10 ثوانٍ للحصول على 0.50 BFP</p>
        <button id="startBtn" class="btn" onclick="startAd()">بدء مشاهدة الإعلان</button>
        <div id="timer"></div>
    </div>
    <a href="dashboard.html" style="color:#fff;">العودة للواجهة</a>

    <script>
        const API_URL = 'https://earn-uq8k.onrender.com/api';
        const user = JSON.parse(localStorage.getItem('user'));

        function startAd() {
            let sec = 10;
            const btn = document.getElementById('startBtn');
            const timer = document.getElementById('timer');
            btn.disabled = true;

            const interval = setInterval(async () => {
                timer.innerText = `المتبقي: ${sec} ثوانٍ`;
                sec--;
                if (sec < 0) {
                    clearInterval(interval);
                    timer.innerText = 'جاري إضافة المكافأة...';
                    
                    const res = await fetch(`${API_URL}/user/watch-ad`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ userId: user._id, reward: 0.50 })
                    });
                    const data = await res.json();
                    if (data.success) {
                        user.dashboardData.balance = data.newBalance;
                        localStorage.setItem('user', JSON.stringify(user));
                        timer.innerText = 'تم إضافة 0.50 BFP لفي حسابك!';
                    }
                }
            }, 1000);
        }
    </script>
</body>
</html>
