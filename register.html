<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - The BlackFlower Pro Art</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: monospace, sans-serif; }
        body { background-color: #000; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .auth-card { border: 2px solid #fff; background: #000; padding: 40px; width: 100%; max-width: 400px; text-align: center; }
        h1 { text-transform: uppercase; letter-spacing: 3px; margin-bottom: 25px; font-size: 1.5rem; }
        .form-group { margin-bottom: 20px; text-align: left; }
        label { display: block; font-size: 0.8rem; text-transform: uppercase; margin-bottom: 5px; color: #aaa; }
        input { width: 100%; background: #000; border: 1px solid #fff; color: #fff; padding: 12px; font-size: 1rem; outline: none; }
        input:focus { border-color: #aaa; }
        .btn-submit { width: 100%; background: #fff; color: #000; border: 1px solid #fff; padding: 12px; font-weight: bold; text-transform: uppercase; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        .btn-submit:hover { background: #000; color: #fff; }
        .auth-links { margin-top: 20px; font-size: 0.8rem; display: flex; justify-content: space-between; }
        .auth-links a { color: #fff; text-decoration: underline; }
        .auth-links a:hover { color: #aaa; }
        #message { margin-top: 15px; font-size: 0.85rem; color: #fff; }
    </style>
</head>
<body>

    <div class="auth-card">
        <h1>Create Account</h1>
        <form id="registerForm">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="username" required>
            </div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" required>
            </div>
            <button type="submit" class="btn-submit">Sign Up</button>
        </form>
        <div id="message"></div>
        <div class="auth-links">
            <a href="login.html">Already have an account? Sign In</a>
        </div>
    </div>

    <script>
        const API_URL = 'https://earn-uq8k.onrender.com/api';

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const msg = document.getElementById('message');

            msg.innerText = 'Creating account...';

            try {
                const res = await fetch(`${API_URL}/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, email, password })
                });
                const data = await res.json();

                if (res.ok && data.success) {
                    // حفظ بيانات المستخدم والداشبورد في المتصفح
                    localStorage.setItem('user', JSON.stringify(data.user));
                    // الدخول التلقائي إلى الواجهة بعد التسجيل لأول مرة
                    window.location.href = 'dashboard.html';
                } else {
                    msg.innerText = data.message || 'Registration failed.';
                }
            } catch (err) {
                msg.innerText = 'Server connection error.';
            }
        });
    </script>
</body>
</html>
