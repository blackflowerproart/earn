<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب جديد - Black Flower Pro Art</title>
    <style>
        body { font-family: Tahoma, sans-serif; background-color: #121212; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { background: #1e1e1e; padding: 30px; border-radius: 8px; width: 350px; border-top: 4px solid #d4af37; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        h2 { text-align: center; color: #d4af37; margin-bottom: 20px; }
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 14px; }
        input { width: 100%; padding: 10px; background: #2a2a2a; border: 1px solid #333; color: #fff; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #d4af37; border: none; color: #121212; font-weight: bold; border-radius: 4px; cursor: pointer; margin-top: 10px; }
        button:hover { background: #c59b27; }
        .back-link { display: block; text-align: center; margin-top: 15px; color: #aaa; text-decoration: none; font-size: 13px; }
        .back-link:hover { color: #d4af37; }
        .message { text-align: center; margin-top: 15px; font-size: 14px; }
        .error { color: #ff5252; }
        .success { color: #4caf50; }
    </style>
</head>
<body>

    <div class="box">
        <h2>إنشاء حساب جديد</h2>
        <form id="registerForm">
            <div class="input-group">
                <label>اسم المستخدم</label>
                <input type="text" id="username" required placeholder="اسمك الكامل">
            </div>
            <div class="input-group">
                <label>البريد الإلكتروني</label>
                <input type="email" id="email" required placeholder="name@example.com">
            </div>
            <div class="input-group">
                <label>كلمة المرور</label>
                <input type="password" id="password" required placeholder="********">
            </div>
            <button type="submit">تسجيل وحفظ البيانات</button>
        </form>
        <div id="msg" class="message"></div>
        <a href="index.html" class="back-link">العودة للرئيسية</a>
    </div>

    <script>
        const API_URL = 'http://localhost:10000/api';

        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const msgDiv = document.getElementById('msg');

            msgDiv.textContent = 'جاري إنشاء الحساب في القاعدة...';
            msgDiv.className = 'message';

            try {
                // نستخدم مسار إنشاء المستخدم في السيرفر
                const response = await fetch(`${API_URL}/admin/create-user`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, email, password })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    msgDiv.textContent = 'تم إنشاء الحساب بنجاح! جاري تحويلك لتسجيل الدخول...';
                    msgDiv.className = 'message success';
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 1500);
                } else {
                    msgDiv.textContent = data.message || 'حدث خطأ أثناء التسجيل';
                    msgDiv.className = 'message error';
                }
            } catch (err) {
                msgDiv.textContent = 'خطأ في الاتصال بالسيرفر';
                msgDiv.className = 'message error';
            }
        });
    </script>
</body>
</html>
