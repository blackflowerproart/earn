<script>
    document.getElementById('register-form').addEventListener('submit', async function(e) {
        e.preventDefault();

        const username = document.getElementById('reg-username').value;
        const email = document.getElementById('reg-email').value;
        const password = document.getElementById('reg-password').value;
        const msgBox = document.getElementById('reg-response-message');
        const submitBtn = document.getElementById('register-btn');

        submitBtn.textContent = 'Creating Account...';
        submitBtn.disabled = true;

        try {
            const response = await fetch('http://localhost:5000/api/register', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ username, email, password })
            });

            const result = await response.json();

            msgBox.style.display = 'block';
            if (response.ok && result.success) {
                msgBox.style.color = '#4CAF50';
                msgBox.textContent = 'Account created successfully! Redirecting to login...';
                
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 2000);
            } else {
                msgBox.style.color = '#f44336';
                msgBox.textContent = result.message || 'Registration failed.';
                submitBtn.textContent = 'Register';
                submitBtn.disabled = false;
            }
        } catch (error) {
            console.error('Error:', error);
            msgBox.style.display = 'block';
            msgBox.style.color = '#f44336';
            msgBox.textContent = 'Server connection error. Please make sure the backend is active.';
            submitBtn.textContent = 'Register';
            submitBtn.disabled = false;
        }
    });
</script>
