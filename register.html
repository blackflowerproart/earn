<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب جديد - The BlackFlower Pro Art</title>
    <style>
        * { box-sizing: border-box; font-family: monospace, sans-serif; margin: 0; padding: 0; }
        body { background: #000; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card { border: 2px solid #fff; background: #000; padding: 30px; width: 100%; max-width: 400px; text-align: center; }
        h1 { text-transform: uppercase; letter-spacing: 2px; margin-bottom: 20px; font-size: 1.3rem; }
        .form-group { margin-bottom: 15px; text-align: right; }
        label { display: block; font-size: 0.8rem; text-transform: uppercase; margin-bottom: 5px; color: #aaa; }
        input { width: 100%; background: #000; border: 1px solid #fff; color: #fff; padding: 10px; font-size: 1rem; outline: none; }
        input:focus { border-color: #aaa; }
        .btn { width: 100%; background: #fff; color: #000; border: 1px solid #fff; padding: 12px; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        .btn:hover { background: #000; color: #fff; }
        .links { margin-top: 15px; font-size: 0.8rem; }
        .links a { color: #fff; text-decoration: underline; }
        #msg { margin-top: 10px; font-size: 0.85rem; }
    </style>
</head>
<body>
    <div class="card">
        <h1>إنشاء حساب جديد</h1>
        <form id="regForm">
            <div class="form-group">
                <label>اسم المستخدم</label>
                <input type="text" id="username" required>
            </div>
            <div class="form-group">
                <label>البريد الإلكتروني</label>
                <input type="email" id="email" required>
            </div>
            <div class="form-group">
                <label>كلمة السر</label>
                <input type="password" id="password" required>
            </div>
            <button type="submit" class="btn">تسجيل الحساب</button>
        </form>
        <div id="msg"></div>
        <div class="links">
            <a href="login.html">لديك حساب بالفعل؟ تسجيل الدخول</a>
        </div>
    </div>

    <script>
        const API_URL = 'https://earn-uq8k.onrender.com/api';
        document.getElementById('regForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const msg = document.getElementById('msg');
            msg.innerText = 'جاري إنشاء الحساب...';

            try {
                const res = await fetch(`${API_URL}/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: document.getElementById('username').value,
                        email: document.getElementById('email').value,
                        password: document.getElementById('password').value
                    })
                });
                const data = await res.json();
                if (res.ok && data.success) {
                    msg.style.color = '#00ff00';
                    msg.innerText = 'تم التسجيل بنجاح! جاري التوجيه...';
                    localStorage.setItem('user', JSON.stringify(data.user));
                    setTimeout(() => window.location.href = 'dashboard.html', 1000);
                } else {
                    msg.style.color = '#ff4d4d';
                    msg.innerText = data.message || 'فشل التسجيل';
                }
            } catch (err) {
                msg.style.color = '#ff4d4d';
                msg.innerText = 'خطأ في الاتصال بالسيرفر';
            }
        });
    </script>
</body>
</html>
