<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Execute Task - The BlackFlower</title>
    
    <link rel="stylesheet" href="css/style.css">

    <style>
        /* تصميم صندوق التنفيذ المتناسق مع الهوية الفخمة للموقع */
        .execute-task-box {
            width: 100%;
            max-width: 700px;
            background-color: #000000;
            border: 2px solid #ffffff;
            padding: 40px;
            margin: 30px auto 0 auto;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
        }

        .task-title-view {
            font-family: 'Times New Roman', Times, serif;
            font-size: 2rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-align: center;
            margin-bottom: 10px;
        }

        .task-reward-badge {
            text-align: center;
            font-size: 1.1rem;
            color: #00ff77;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 30px;
            font-family: monospace;
            font-weight: bold;
        }

        .info-section {
            border: 1px solid #222222;
            background-color: #050505;
            padding: 20px;
            margin-bottom: 25px;
        }

        .info-section h4 {
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
            color: #ffffff;
            border-bottom: 1px solid #111111;
            padding-bottom: 5px;
        }

        .task-instructions {
            font-family: Arial, sans-serif;
            font-size: 0.95rem;
            color: #aaaaaa;
            line-height: 1.6;
            white-space: pre-line; /* للحفاظ على تنسيق السطور والفقرات */
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 20px;
        }

        .form-group label {
            font-family: Arial, sans-serif;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #ffffff;
            font-weight: bold;
        }

        .form-control-file {
            background-color: #000000;
            color: #aaaaaa;
            padding: 10px 0;
            cursor: pointer;
            font-family: Arial, sans-serif;
            font-size: 0.9rem;
        }

        /* تنسيق الأزرار الحادة المتطابقة مع الـ buttons لديك */
        .btn-row {
            display: flex;
            gap: 15px;
            margin-top: 25px;
        }

        .execute-task-box .btn-blackflower {
            flex: 1;
            text-align: center;
            padding: 14px;
            font-size: 1rem;
        }

        .btn-secondary-bf {
            background-color: #000000;
            color: #ffffff;
            border: 1px solid #ffffff;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .btn-secondary-bf:hover {
            background-color: #ffffff;
            color: #000000;
        }
    </style>
</head>
<body>

    <header class="main-header">
        <div class="header-container">
            <img src="logo.png" alt="BlackFlower Logo" class="header-logo">
            <div class="header-text-block">
                <div class="brand-title">The BlackFlower</div>
                <div class="brand-subtitle">Professional Art</div>
            </div>
        </div>
    </header>

    <div class="container">
        
        <div id="loading-fallback" style="text-align: center; margin-top: 50px; color: #666;">
            LOADING TASK CONFIGURATION...
        </div>

        <div class="execute-task-box" id="main-task-box" style="display: none;">
            <h2 class="task-title-view" id="display-title">TASK TITLE</h2>
            <div class="task-reward-badge">REWARD: <span id="display-reward">$0.0000</span></div>

            <div class="info-section">
                <h4>📋 Instructions / Requirements</h4>
                <p class="task-instructions" id="display-details">Loading instructions...</p>
            </div>

            <a href="#" target="_blank" id="target-link-btn" class="btn-secondary-bf" style="width: 100%; text-align: center; padding: 15px; margin-bottom: 25px; box-sizing: border-box;">
                Step 1: Open Target Link →
            </a>

            <form id="submissionForm">
                <div class="form-group">
                    <label for="proofMedia">Step 2: Upload Proof Screenshot (Optional)</label>
                    <input type="file" id="proofMedia" class="form-control-file" accept="image/*">
                </div>

                <div class="btn-row">
                    <a href="dashboard.html" class="btn-secondary-bf" style="padding: 14px; text-align: center; max-width: 120px;">Cancel</a>
                    <button type="submit" id="submitBtn" class="btn-blackflower">Submit & Freeze Task</button>
                </div>
            </form>
        </div>

    </div>
    
    <script>
        const API_URL = 'http://localhost:5000/api';

        // 1. استخراج الـ ID الخاص بالمهمة من رابط الصفحة URL
        const urlParams = new URLSearchParams(window.location.search);
        const taskId = urlParams.get('id');
        let currentUser = null;

        document.addEventListener("DOMContentLoaded", () => {
            const savedUser = localStorage.getItem('user');
            if (!savedUser) {
                alert('Please login first');
                window.location.href = 'login.html';
                return;
            }
            currentUser = JSON.parse(savedUser);

            if (!taskId) {
                alert("Invalid URL. Returning to Dashboard.");
                window.location.href = 'dashboard.html';
                return;
            }

            fetchTaskDetails();
        });

        // 2. جلب تفاصيل المهمة المحددة من السيرفر المحلي (MongoDB) لعرضها للمستخدم
        async function fetchTaskDetails() {
            try {
                const response = await fetch(`${API_URL}/task-details?id=${taskId}`);
                const result = await response.json();

                if (!result.success || !result.task) {
                    throw new Error(result.message || "Task not found or has been archived.");
                }

                const task = result.task;

                // حقن البيانات في الـ HTML
                document.getElementById('display-title').innerText = task.title;
                document.getElementById('display-reward').innerText = `$${parseFloat(task.reward || 0.00).toFixed(4)}`;
                document.getElementById('display-details').innerText = task.details || task.description;
                document.getElementById('target-link-btn').href = task.target_url || '#';

                // إظهار الصندوق الرئيسي وإخفاء كلمة Loading
                document.getElementById('loading-fallback').style.display = 'none';
                document.getElementById('main-task-box').style.display = 'block';

            } catch (err) {
                alert(err.message);
                window.location.href = 'dashboard.html';
            }
        }

        // 3. معالجة إرسال الإثبات للسيرفر لتجميد المهمة للمستخدم وتسجيل الإرسالية
        document.getElementById('submissionForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.innerText = "SUBMITTING PROOF...";

            try {
                const proofFile = document.getElementById('proofMedia').files[0];
                let proofBase64 = null;

                // إذا قام المستخدم برفع صورة إثبات، نقوم بتحويلها إلى Base64 أو رفعها عبر FormData للسيرفر
                if (proofFile) {
                    proofBase64 = await convertFileToBase64(proofFile);
                }

                const payload = {
                    task_id: taskId,
                    user_email: currentUser.email,
                    proof_image: proofBase64
                };

                const response = await fetch(`${API_URL}/submit-task`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                const result = await response.json();

                if (!result.success) {
                    throw new Error(result.message || "Failed to submit task.");
                }

                alert("Success! Your submission is recorded. The task is now locked and frozen for you.");
                window.location.href = 'dashboard.html'; // العودة للوحة التحكم

            } catch (error) {
                alert("Error: " + error.message);
                submitBtn.disabled = false;
                submitBtn.innerText = "Submit & Freeze Task";
            }
        });

        // دالة مساعدة لتحويل الملف إلى Base64 لتخزينه بسهولة مع الـ JSON
        function convertFileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        }
    </script>
</body>
</html>
