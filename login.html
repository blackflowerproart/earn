<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - Black Flower Pro Art</title>
    <style>
        body { font-family: Tahoma, sans-serif; background-color: #121212; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-box { background: #1e1e1e; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); width: 350px; }
        h2 { text-align: center; color: #d4af37; margin-bottom: 20px; }
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 14px; }
        input { width: 100%; padding: 10px; border: 1px solid #333; background: #2a2a2a; color: #fff; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #d4af37; border: none; color: #121212; font-weight: bold; border-radius: 4px; cursor: pointer; margin-top: 10px; }
        button:hover { background: #c59b27; }
        .message { text-align: center; margin-top: 15px; font-size: 14px; }
        .error { color: #ff5252; }
        .success { color: #4caf50; }
    </style>
</head>
<body>

    <div class="login-box">
        <h2>تسجيل الدخول</h2>
        <form id="loginForm">
            <div class="input-group">
                <label>البريد الإلكتروني</label>
                <input type="email" id="email" required placeholder="name@example.com">
            </div>
            <div class="input-group">
                <label>كلمة المرور</label>
                <input type="password" id="password" required placeholder="********">
            </div>
            <button type="submit">دخول</button>
        </form>
        <div id="message" class="message"></div>
    </div>

    <script>
        const API_URL = 'http://localhost:10000/api'; // قم بتعديل الرابط عند رفع السيرفر أونلاين

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const msgDiv = document.getElementById('message');

            msgDiv.textContent = 'جاري التحقق وتسجيل الدخول...';
            msgDiv.className = 'message';

            try {
                const response = await fetch(`${API_URL}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    msgDiv.textContent = 'تم تسجيل الدخول بنجاح! جاري تحويلك...';
                    msgDiv.className = 'message success';
                    
                    // حفظ بيانات المستخدم والداشبورد في LocalStorage
                    localStorage.setItem('currentUser', JSON.stringify(data.user));
                    
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 1000);
                } else {
                    msgDiv.textContent = data.message || 'بيانات الدخول غير صحيحة';
                    msgDiv.className = 'message error';
                }
            } catch (err) {
                msgDiv.textContent = 'خطأ في الاتصال بالخادم (Server Error)';
                msgDiv.className = 'message error';
            }
        });
    </script>
</body>
</html>
