<script>
    document.getElementById('login-form').addEventListener('submit', async function(e) {
        e.preventDefault();

        const email = document.getElementById('login-email').value;
        const password = document.getElementById('login-password').value;
        const msgBox = document.getElementById('response-message');
        const submitBtn = document.getElementById('login-btn');

        submitBtn.textContent = 'Authenticating...';
        submitBtn.disabled = true;

        try {
            // إرسال البيانات إلى السيرفر (استبدل الرابط برابط سيرفرك المستضاف لاحقاً)
            const response = await fetch('http://localhost:5000/api/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ email, password })
            });

            const result = await response.json();

            msgBox.style.display = 'block';
            if (response.ok && result.success) {
                msgBox.style.color = '#4CAF50';
                msgBox.textContent = `Welcome back, ${result.user.username}! Redirecting...`;
                
                localStorage.setItem('user', JSON.stringify(result.user));

                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1500);
            } else {
                msgBox.style.color = '#f44336';
                msgBox.textContent = result.message || 'Invalid email or password.';
                submitBtn.textContent = 'Login';
                submitBtn.disabled = false;
            }
        } catch (error) {
            console.error('Error:', error);
            msgBox.style.display = 'block';
            msgBox.style.color = '#f44336';
            msgBox.textContent = 'Server connection error. Make sure the backend is running.';
            submitBtn.textContent = 'Login';
            submitBtn.disabled = false;
        }
    });
</script>
