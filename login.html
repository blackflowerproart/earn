<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - The BlackFlower</title>
    
    <link rel="stylesheet" href="css/style.css">
    
    <style>
        .form-group {
            margin-bottom: 20px;
            width: 100%;
            max-width: 400px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .form-group input {
            width: 100%;
            padding: 12px;
            background-color: #000000;
            border: 1px solid #444444;
            color: #ffffff;
            font-family: inherit;
        }
        .form-group input:focus {
            outline: none;
            border-color: #ffffff;
        }
        .account-links {
            margin-top: 30px; 
            border-top: 1px dashed #333333; 
            padding-top: 20px;
            text-align: center;
            font-size: 0.9rem;
            line-height: 2;
        }
        .msg {
            margin-top: 20px;
            font-size: 0.9rem;
            text-align: center;
        }
    </style>
</head>
<body>

    <header class="main-header">
        <div class="header-container">
            <img src="logo.png" alt="BlackFlower Logo" class="header-logo">
            <div class="header-text-block">
                <div class="brand-title">The BlackFlower</div>
                <div class="brand-subtitle">Professional Art</div>
            </div>
        </div>
    </header>

    <div class="container">
        <h2 style="text-transform: uppercase; letter-spacing: 2px; margin-bottom: 10px;">Member Login</h2>
        <p style="color: #aaaaaa; margin-bottom: 40px; font-size: 0.9rem;">Access your dashboard and manage your projects.</p>
        
        <form id="login-form" style="width: 100%; max-width: 400px; display: flex; flex-direction: column; align-items: center;">
            <div class="form-group">
                <link rel="stylesheet" href="">
                <label for="login-email">Email Address</label>
                <input type="email" id="login-email" placeholder="name@example.com" required>
            </div>

            <div class="form-group">
                <label for="login-password">Password</label>
                <input type="password" id="login-password" placeholder="••••••••" required>
            </div>

            <div class="auth-buttons-container" style="margin-top: 20px; width: 100%;">
                <button type="submit" id="login-btn" class="btn-blackflower" style="width: 100%; padding: 14px;">Login</button>
            </div>
        </form>

        <div class="account-links">
            <p>Forgot your password? <a href="forgot-password.html">Reset it here</a></p>
            <p>Don't have an account? <a href="register.html">Create New Account</a></p>
        </div>

        <p id="response-message" class="msg" style="display: none;"></p>
    </div>

    <script>
        const API_URL = 'http://localhost:5000/api';

        document.getElementById('login-form').addEventListener('submit', async function(e) {
            e.preventDefault();

            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            const msgBox = document.getElementById('response-message');
            const submitBtn = document.getElementById('login-btn');

            submitBtn.textContent = 'Authenticating...';
            submitBtn.disabled = true;

            try {
                const response = await fetch(`${API_URL}/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                });

                const result = await response.json();

                msgBox.style.display = 'block';
                if (response.ok && result.success) {
                    msgBox.style.color = '#00ff77';
                    msgBox.textContent = `Welcome back, ${result.user.username || 'Artist'}! Redirecting...`;
                    
                    localStorage.setItem('user', JSON.stringify(result.user));

                    setTimeout(() => {
                        window.location.href = 'dashboard.html'; // التوجيه للوحة التحكم مباشرة
                    }, 1500);
                } else {
                    msgBox.style.color = '#ff4444';
                    msgBox.textContent = result.message || 'Invalid email or password.';
                    submitBtn.textContent = 'Login';
                    submitBtn.disabled = false;
                }
            } catch (error) {
                console.error('Error:', error);
                msgBox.style.display = 'block';
                msgBox.style.color = '#ff4444';
                msgBox.textContent = 'Server connection error. Make sure the backend is running.';
                submitBtn.textContent = 'Login';
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
