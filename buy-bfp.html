<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Buy BFP Token</title>
    <style>
        * { box-sizing: border-box; font-family: monospace, sans-serif; margin: 0; padding: 0; }
        body { background: #000; color: #fff; padding: 20px; text-align: center; }
        .payment-card { border: 2px solid #fff; max-width: 450px; margin: 20px auto; padding: 25px; }
        .btn-pay { width: 100%; background: #fff; color: #000; padding: 12px; margin: 10px 0; font-weight: bold; border: 1px solid #fff; cursor: pointer; }
        .btn-pay:hover { background: #000; color: #fff; }
    </style>
</head>
<body>
    <h1>شراء عملة BFP الرقمية</h1>
    <div class="payment-card">
        <h3>اختر طريقة الدفع</h3>
        <p style="margin-bottom: 20px; color: #aaa;">1 BFP = $1.00 USD</p>
        
        <!-- FaucetPay Integration Form -->
        <form action="https://faucetpay.io/merchant/webpay" method="post" target="_blank">
            <input type="hidden" name="merchant_username" value="blackflowerproart">
            <input type="hidden" name="item_name" value="Buy BFP Tokens">
            <input type="hidden" name="currency1" value="USD">
            <button type="submit" class="btn-pay">الدفع عبر FaucetPay</button>
        </form>

        <!-- PayPal Standard Link/Button -->
        <a href="https://paypal.me/blackflowerproart" target="_blank">
            <button class="btn-pay">الدفع عبر PayPal</button>
        </a>
    </div>
    <a href="dashboard.html" style="color: #fff;">العودة للواجهة</a>
</body>
</html>
