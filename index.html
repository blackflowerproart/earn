<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - The Black Flower Pro Art</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- الشريط العلوي الموحد الثابت -->
    <header class="site-header">
        <div class="header-left">
            <img src="black.jpg" alt="Logo" class="site-logo">
            <span class="brand-title">The Black Flower</span>
        </div>
        <div class="header-right">
            <span>Professional Art</span>
        </div>
    </header>

    <div class="page-container">
        <h2>Member Login</h2>
        <form id="loginForm">
            <div class="form-group">
                <label>Email or Username</label>
                <input type="text" id="loginEmail" required placeholder="Enter your email">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="loginPassword" required placeholder="********">
            </div>
            <button type="submit" class="btn">Login to Dashboard</button>
        </form>
    </div>

    <script>
        const API_URL = 'https://earn-uq8k.onrender.com/api';

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;

            try {
                const response = await fetch(`${API_URL}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await response.json();

                if (data.success) {
                    localStorage.setItem('currentUser', JSON.stringify(data.user));
                    window.location.href = 'dashboard.html';
                } else {
                    alert(data.message || 'Login failed.');
                }
            } catch (err) {
                console.error('Error:', err);
                alert('Connection error with server.');
            }
        });
    </script>
</body>
</html>
