<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Black Flower Pro Art - البداية</title>
    <style>
        body { font-family: Tahoma, sans-serif; background-color: #121212; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .welcome-box { background: #1e1e1e; padding: 40px; border-radius: 10px; text-align: center; width: 380px; border-top: 4px solid #d4af37; box-shadow: 0 4px 15px rgba(0,0,0,0.6); }
        h1 { color: #d4af37; font-size: 22px; margin-bottom: 10px; }
        p { color: #aaa; font-size: 14px; margin-bottom: 30px; }
        .btn { display: block; width: 100%; padding: 12px; margin: 10px 0; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 15px; text-decoration: none; box-sizing: border-box; }
        .btn-login { background: #d4af37; color: #121212; }
        .btn-login:hover { background: #c59b27; }
        .btn-register { background: #2a2a2a; color: #fff; border: 1px solid #444; }
        .btn-register:hover { background: #333; }
    </style>
</head>
<body>

    <div class="welcome-box">
        <h1>مرحباً بك في Black Flower Pro Art</h1>
        <p>منصتك المتكاملة للإدارة والخدمات الرقمية</p>
        
        <a href="login.html" class="btn btn-login">تسجيل الدخول</a>
        <a href="register.html" class="btn btn-register">إنشاء حساب جديد</a>
    </div>

</body>
</html>
