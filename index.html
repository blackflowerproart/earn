<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal - The Black Flower Professional Art</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- الشريط العلوي الثابت والموحد -->
    <header class="site-header">
        <div class="header-left">
            <img src="logo.png" alt="Logo" class="site-logo">
            <span class="brand-title">The Black Flower</span>
        </div>
        <div class="header-right">
            <span>Professional Art</span>
        </div>
    </header>

    <div class="page-container" style="text-align: center;">
        <h2>Welcome to Member Portal</h2>
        <p style="color: #aaa; font-size: 0.85rem; margin-bottom: 25px;">Please choose an option below to continue to your account or create a new one.</p>
        
        <!-- أزرار التوجيه بين الدخول والتسجيل -->
        <div style="display: flex; gap: 15px; justify-content: center;">
            <button onclick="showLoginForm()" class="btn" id="loginBtnTab" style="background: #fff; color: #000; font-weight: bold;">Login</button>
            <button onclick="showRegisterForm()" class="btn" id="registerBtnTab" style="background: #000; color: #fff;">Register</button>
        </div>

        <div style="margin-top: 30px; text-align: left;">
            <!-- نموذج تسجيل الدخول -->
            <form id="loginFormSection">
                <div class="form-group">
                    <label>Email or Username</label>
                    <input type="text" id="loginEmail" required placeholder="Enter your email or username">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="loginPassword" required placeholder="Enter your password">
                </div>
                <button type="submit" class="btn">Sign In</button>
            </form>

            <!-- نموذج التسجيل الجديد (مخفي افتراضياً ويظهر عند النقر على زر التسجيل) -->
            <form id="registerFormSection" style="display: none;">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="regUsername" placeholder="Choose a username">
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="regEmail" placeholder="Enter your email">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="regPassword" placeholder="Create a secure password">
                </div>
                <button type="submit" class="btn" style="background: #fff; color: #000; font-weight: bold;">Create Account</button>
            </form>
        </div>
    </div>

    <script>
        const API_URL = 'https://earn-uq8k.onrender.com/api';

        function showLoginForm() {
            document.getElementById('loginFormSection').style.display = 'block';
            document.getElementById('registerFormSection').style.display = 'none';
            document.getElementById('loginBtnTab').style.background = '#fff';
            document.getElementById('loginBtnTab').style.color = '#000';
            document.getElementById('registerBtnTab').style.background = '#000';
            document.getElementById('registerBtnTab').style.color = '#fff';
        }

        function showRegisterForm() {
            document.getElementById('loginFormSection').style.display = 'none';
            document.getElementById('registerFormSection').style.display = 'block';
            document.getElementById('registerBtnTab').style.background = '#fff';
            document.getElementById('registerBtnTab').style.color = '#000';
            document.getElementById('loginBtnTab').style.background = '#000';
            document.getElementById('loginBtnTab').style.color = '#fff';
        }

        // معالجة تسجيل الدخول
        document.getElementById('loginFormSection').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;

            try {
                const response = await fetch(`${API_URL}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await response.json();

                if (data.success) {
                    localStorage.setItem('currentUser', JSON.stringify(data.user));
                    window.location.href = 'dashboard.html';
                } else {
                    alert(data.message || 'Invalid credentials.');
                }
            } catch (err) {
                console.error('Error:', err);
                alert('Server connection error.');
            }
        });

        // معالجة التسجيل الجديد (اختياري في حال أردت تفعيل مسار التسجيل في السيرفر لاحقاً)
        document.getElementById('registerFormSection').addEventListener('submit', (e) => {
            e.preventDefault();
            alert('Registration feature is managed by the system administrator.');
        });
    </script>
</body>
</html>
