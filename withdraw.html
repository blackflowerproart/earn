<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Withdraw Funds - The Black Flower Professional Art</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .withdraw-card {
            border: 1px solid #333;
            background: #050505;
            padding: 30px;
            max-width: 600px;
            margin: 0 auto;
        }
        .balance-box {
            background: #0a0a0a;
            border: 1px solid #444;
            padding: 20px;
            text-align: center;
            margin-bottom: 25px;
        }
        .balance-value {
            font-size: 2rem;
            color: #00ff66;
            font-weight: bold;
            margin-top: 5px;
        }
        .gateway-options {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }
        .gateway-btn {
            padding: 15px;
            border: 1px solid #555;
            background: #000;
            color: #fff;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 0.8rem;
            transition: 0.3s;
            text-align: center;
        }
        .gateway-btn.selected {
            border-color: #fff;
            background: #fff;
            color: #000;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- الشريط العلوي الثابت والموحد -->
    <header class="site-header">
        <div class="header-left">
            <img src="logo.png" alt="Logo" class="site-logo">
            <span class="brand-title">The Black Flower</span>
        </div>
        <div class="header-right">
            <span>Professional Art</span>
        </div>
    </header>

    <div class="dashboard-container" style="max-width: 800px;">
        <div class="dash-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px;">
            <div>
                <h1>Withdraw Your Earnings</h1>
                <span style="color: #888; font-size: 0.75rem;">Convert your BFP balance into withdrawable assets</span>
            </div>
            <div>
                <a href="dashboard.html" class="btn" style="width: auto; margin-top:0; padding: 8px 15px;">Back to Dashboard</a>
            </div>
        </div>

        <div class="withdraw-card">
            <!-- صندوق الرصيد المتاح -->
            <div class="balance-box">
                <span style="color: #aaa; font-size: 0.85rem; text-transform: uppercase;">Available Balance</span>
                <div class="balance-value" id="userBalanceDisplay">0 BFP</div>
                <span style="color: #666; font-size: 0.75rem;" id="usdEquivalent">Equivalent to $0.00 USD</span>
            </div>

            <form id="withdrawForm" onsubmit="processWithdrawal(event)">
                <div class="form-group">
                    <label>Amount to Withdraw (BFP)</label>
                    <input type="number" id="withdrawAmount" placeholder="Enter BFP amount" min="1000" required>
                    <small style="color: #888; font-size: 0.7rem; margin-top: 5px; display: block;">Minimum withdrawal: 1,000 BFP ($1.00 USD)</small>
                </div>

                <div class="form-group">
                    <label>Select Withdrawal Method</label>
                    <div class="gateway-options">
                        <div class="gateway-btn selected" id="methodFaucetPay" onclick="selectMethod('faucetpay')">FaucetPay</div>
                        <div class="gateway-btn" id="methodPayPal" onclick="selectMethod('paypal')">PayPal</div>
                    </div>
                </div>

                <div class="form-group">
                    <label id="accountLabel">FaucetPay Email / Wallet Address</label>
                    <input type="text" id="walletAccount" placeholder="Enter your email or address" required>
                </div>

                <button type="submit" class="btn" style="background: #fff; color: #000; font-weight: bold; margin-top: 10px;">Submit Withdrawal Request</button>
            </form>
        </div>
    </div>

    <script>
        const API_URL = 'https://earn-uq8k.onrender.com/api';
        let selectedMethodType = 'faucetpay';

        window.onload = function() {
            const currentUser = JSON.parse(localStorage.getItem('currentUser'));
            if (currentUser) {
                document.getElementById('userBalanceDisplay').innerText = `${currentUser.balance.toLocaleString()} BFP`;
                const usdVal = currentUser.balance * 0.001;
                document.getElementById('usdEquivalent').innerText = `Equivalent to $${usdVal.toFixed(2)} USD`;
                document.getElementById('withdrawAmount').max = currentUser.balance;
            } else {
                alert('Please log in first.');
                window.location.href = 'index.html';
            }
        };

        function selectMethod(method) {
            selectedMethodType = method;
            if(method === 'faucetpay') {
                document.getElementById('methodFaucetPay').classList.add('selected');
                document.getElementById('methodPayPal').classList.remove('selected');
                document.getElementById('accountLabel').innerText = 'FaucetPay Email / Wallet Address';
            } else {
                document.getElementById('methodPayPal').classList.add('selected');
                document.getElementById('methodFaucetPay').classList.remove('selected');
                document.getElementById('accountLabel').innerText = 'PayPal Registered Email';
            }
        }

        async function processWithdrawal(event) {
            event.preventDefault();
            const amount = parseFloat(document.getElementById('withdrawAmount').value);
            const account = document.getElementById('walletAccount').value;
            const currentUser = JSON.parse(localStorage.getItem('currentUser'));

            if (!currentUser || !currentUser.id) {
                alert('Session expired. Please log in again.');
                window.location.href = 'index.html';
                return;
            }

            if (amount < 1000) {
                alert('Minimum withdrawal amount is 1,000 BFP.');
                return;
            }

            if (amount > currentUser.balance) {
                alert('Insufficient balance for this withdrawal.');
                return;
            }

            try {
                const response = await fetch(`${API_URL}/withdraw`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        userId: currentUser.id,
                        amountBfp: amount,
                        method: selectedMethodType,
                        account: account
                    })
                });

                const data = await response.json();

                if (data.success) {
                    currentUser.balance = data.newBalance;
                    localStorage.setItem('currentUser', JSON.stringify(currentUser));

                    alert(`Withdrawal request of ${amount.toLocaleString()} BFP submitted successfully and saved in database!`);
                    window.location.href = 'dashboard.html';
                } else {
                    alert(data.message || 'Failed to process withdrawal.');
                }
            } catch (err) {
                console.error('Error connecting to server:', err);
                alert('Server connection error during withdrawal.');
            }
        }
    </script>
</body>
</html>
