<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Withdraw Funds - The Black Flower</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { background: #000; color: #fff; font-family: monospace, sans-serif; padding: 20px; }
        .withdraw-container { max-width: 500px; margin: 50px auto; border: 2px solid #fff; padding: 30px; background: #050505; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-size: 0.75rem; text-transform: uppercase; margin-bottom: 8px; color: #aaa; }
        input { width: 100%; background: #000; border: 1px solid #fff; color: #fff; padding: 10px; font-size: 0.9rem; outline: none; }
        .btn { background: #fff; color: #000; border: 1px solid #fff; padding: 10px 15px; width: 100%; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        .btn:hover { background: #00ff66; border-color: #00ff66; }
    </style>
</head>
<body>
    <div class="withdraw-container">
        <h2>Withdraw Funds (سحب الأرباح)</h2>
        <p style="font-size: 0.8rem; color: #888; margin-bottom: 20px;">Available Balance: <span id="lblBalance" style="color:#00ff66; font-weight:bold;">0.00 BFP</span></p>
        
        <div class="form-group">
            <label>Amount to Withdraw (BFP)</label>
            <input type="number" id="withdrawAmt" placeholder="0.00" step="0.01">
        </div>
        <div class="form-group">
            <label>Wallet / Destination Address</label>
            <input type="text" id="walletAddress" placeholder="Enter your crypto wallet or account info...">
        </div>
        
        <button class="btn" onclick="submitWithdrawal()">Submit Withdrawal Request</button>
        <br><br>
        <a href="dashboard.html" style="color: #aaa; font-size: 0.75rem; text-decoration: underline;">Back to Dashboard</a>
    </div>

    <script>
        let currentUser = JSON.parse(localStorage.getItem('currentUser')) || { balance: 0 };
        document.getElementById('lblBalance').innerText = `${currentUser.balance.toFixed(2)} BFP`;

        function submitWithdrawal() {
            const amt = parseFloat(document.getElementById('withdrawAmt').value);
            const wallet = document.getElementById('walletAddress').value;

            if (!amt || amt <= 0 || amt > currentUser.balance) {
                alert('Invalid withdrawal amount or insufficient balance.');
                return;
            }
            if (!wallet) {
                alert('Please enter your destination wallet address.');
                return;
            }

            currentUser.balance -= amt;
            localStorage.setItem('currentUser', JSON.stringify(currentUser));
            alert('Withdrawal request successfully sent to administration processing queue.');
            window.location.href = 'dashboard.html';
        }
    </script>
</body>
</html>
