<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Executive Admin Control - The BlackFlower Pro Art</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: monospace, sans-serif; }
        body { background-color: #000; color: #fff; padding: 20px; }
        .admin-container { max-width: 1400px; margin: 0 auto; }
        .admin-header { border: 2px solid #fff; padding: 20px; margin-bottom: 25px; display: flex; justify-content: space-between; align-items: center; background: #000; }
        .admin-header h1 { text-transform: uppercase; font-size: 1.4rem; letter-spacing: 2px; }
        .admin-badge { background: #fff; color: #000; padding: 5px 10px; font-size: 0.75rem; font-weight: bold; text-transform: uppercase; }

        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .stat-box { border: 1px solid #fff; padding: 15px; background: #050505; text-align: center; }
        .stat-box h3 { font-size: 0.75rem; color: #aaa; text-transform: uppercase; margin-bottom: 5px; }
        .stat-box .val { font-size: 1.5rem; font-weight: bold; color: #fff; }

        .table-wrapper { border: 2px solid #fff; overflow-x: auto; background: #000; }
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.8rem; }
        th, td { border: 1px solid #333; padding: 12px 10px; white-space: nowrap; }
        th { background: #111; color: #fff; text-transform: uppercase; font-size: 0.75rem; }
        tr:hover { background: #080808; }

        .status-online { color: #00ff00; font-weight: bold; }
        .status-offline { color: #888; }
        .btn { background: #000; color: #fff; border: 1px solid #fff; padding: 5px 10px; cursor: pointer; text-transform: uppercase; font-size: 0.7rem; transition: 0.3s; margin-right: 3px; }
        .btn:hover { background: #fff; color: #000; }
        .btn-funds { border-color: #00ff66; color: #00ff66; }
        .btn-funds:hover { background: #00ff66; color: #000; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { border: 2px solid #fff; background: #000; padding: 30px; width: 100%; max-width: 500px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 0.75rem; text-transform: uppercase; margin-bottom: 5px; color: #aaa; }
        input { width: 100%; background: #000; border: 1px solid #fff; color: #fff; padding: 8px; font-size: 0.85rem; outline: none; }
        .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
    </style>
</head>
<body>

    <div class="admin-container">
        <div class="admin-header">
            <h1>Executive Administration Dashboard</h1>
            <span class="admin-badge">Secure Access - CEO Only</span>
        </div>

        <div class="stats-grid">
            <div class="stat-box">
                <h3>Total Users</h3>
                <div class="val" id="totalUsers">0</div>
            </div>
            <div class="stat-box">
                <h3>Total System Balance</h3>
                <div class="val" id="totalBalance">0.00 BFP</div>
            </div>
        </div>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Username / Email</th>
                        <th>Joined Date</th>
                        <th>Status</th>
                        <th>Balance (BFP)</th>
                        <th>Level</th>
                        <th>Actions (Edit / Send Funds)</th>
                    </tr>
                </thead>
                <tbody id="usersTableBody">
                    <tr><td colspan="6" style="text-align: center; color: #666;">Loading database from MongoDB...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Edit User Modal -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <h2>Edit User Data (MongoDB)</h2>
            <form id="editForm">
                <input type="hidden" id="editUserId">
                <div class="form-group"><label>Username</label><input type="text" id="editUsername" required></div>
                <div class="form-group"><label>Email</label><input type="email" id="editEmail" required></div>
                <div class="form-group"><label>Balance (BFP)</label><input type="number" step="0.01" id="editBalance" required></div>
                <div class="form-group"><label>Level</label><input type="number" id="editLevel" required></div>
                <div class="modal-actions">
                    <button type="button" class="btn" onclick="closeModal()">Cancel</button>
                    <button type="submit" class="btn" style="background:#fff; color:#000; font-weight:bold;">Save to DB</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Send Funds Modal (مع إرسال إشعار فوري للمستخدم) -->
    <div id="fundsModal" class="modal">
        <div class="modal-content">
            <h2>Send Funds & Notify User</h2>
            <form id="fundsForm">
                <input type="hidden" id="fundsUserId">
                <div class="form-group"><label>Amount (BFP)</label><input type="number" step="0.01" id="sendAmount" required placeholder="0.00"></div>
                <div class="form-group"><label>Reason / Note</label><input type="text" id="sendReason" required placeholder="e.g. Monthly Reward / Task Bonus"></div>
                <div class="modal-actions">
                    <button type="button" class="btn" onclick="closeFundsModal()">Cancel</button>
                    <button type="submit" class="btn" style="background:#00ff66; color:#000; font-weight:bold;">Send & Notify</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const API_URL = 'https://earn-uq8k.onrender.com/api';

        document.addEventListener('DOMContentLoaded', () => { fetchAdminData(); });

        async function fetchAdminData() {
            try {
                const res = await fetch(`${API_URL}/admin/users`);
                const data = await res.json();
                if (data.success && data.users) {
                    renderTable(data.users);
                    document.getElementById('totalUsers').innerText = data.users.length;
                    const totalBal = data.users.reduce((acc, u) => acc + (u.balance || 0), 0);
                    document.getElementById('totalBalance').innerText = `${totalBal.toFixed(2)} BFP`;
                }
            } catch (err) {
                console.error('Error fetching admin data');
            }
        }

        function renderTable(users) {
            const tbody = document.getElementById('usersTableBody');
            tbody.innerHTML = users.map(u => `
                <tr>
                    <td><strong>${u.username}</strong><br><span style="color:#888;">${u.email}</span></td>
                    <td>${new Date(u.createdAt).toLocaleDateString()}</td>
                    <td>${u.isOnline ? '<span class="status-online">● ONLINE</span>' : '<span class="status-offline">○ OFFLINE</span>'}</td>
                    <td>${u.balance.toFixed(2)} BFP</td>
                    <td>Lvl ${u.level || 1}</td>
                    <td>
                        <button class="btn" onclick="openEditModal('${u._id}', '${u.username}', '${u.email}', ${u.balance}, ${u.level || 1})">Edit</button>
                        <button class="btn btn-funds" onclick="openFundsModal('${u._id}')">Send Funds 🔔</button>
                    </td>
                </tr>
            `).join('');
        }

        function openEditModal(id, username, email, balance, level) {
            document.getElementById('editUserId').value = id;
            document.getElementById('editUsername').value = username;
            document.getElementById('editEmail').value = email;
            document.getElementById('editBalance').value = balance;
            document.getElementById('editLevel').value = level;
            document.getElementById('editModal').style.display = 'flex';
        }

        function closeModal() { document.getElementById('editModal').style.display = 'none'; }

        function openFundsModal(id) {
            document.getElementById('fundsUserId').value = id;
            document.getElementById('sendAmount').value = '';
            document.getElementById('sendReason').value = '';
            document.getElementById('fundsModal').style.display = 'flex';
        }

        function closeFundsModal() { document.getElementById('fundsModal').style.display = 'none'; }

        document.getElementById('editForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('editUserId').value;
            const updatedData = {
                username: document.getElementById('editUsername').value,
                email: document.getElementById('editEmail').value,
                balance: parseFloat(document.getElementById('editBalance').value),
                level: parseInt(document.getElementById('editLevel').value)
            };
            const res = await fetch(`${API_URL}/admin/user/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(updatedData)
            });
            if (res.ok) { alert('Updated successfully in MongoDB!'); closeModal(); fetchAdminData(); }
        });

        document.getElementById('fundsForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const userId = document.getElementById('fundsUserId').value;
            const amount = parseFloat(document.getElementById('sendAmount').value);
            const reason = document.getElementById('sendReason').value;

            const res = await fetch(`${API_URL}/user/send-funds`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ userId, amount, reason })
            });
            const data = await res.json();
            if (data.success) {
                alert('Funds sent successfully and real-time notification generated for the user!');
                closeFundsModal();
                fetchAdminData();
            } else {
                alert('Failed to send funds.');
            }
        });
    </script>
</body>
</html>
