<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8"><title>لوحة تحكم الأدمن</title>
    <style>body{background:#121212;color:#fff;font-family:Tahoma;padding:20px;} .box{background:#1e1e1e;padding:15px;margin-bottom:15px;border-radius:6px;border-right:4px solid #d4af37;} button{background:#4caf50;color:#fff;border:none;padding:5px 10px;cursor:pointer;}</style>
</head>
<body>
    <h2>لوحة تحكم المشرف (Admin Control)</h2>
    <h3>طلبات تعديل الحساب بانتظار الموافقة:</h3>
    <div id="requestsList">جاري التحميل...</div>

    <h3>رسائل الدعم الفني:</h3>
    <div id="supportList">جاري التحميل...</div>

    <script>
        async function loadAdminData() {
            const res = await fetch('https://earn-uq8k.onrender.com/api/admin/data');
            const data = await res.json();
            
            let reqHtml = '';
            data.updateRequests.forEach(r => {
                reqHtml += `<div class="box">مستخدم: ${r.oldUsername} يريد التعديل إلى -> ${r.newUsername} <button onclick="approve('${r._id}')">موافقة</button></div>`;
            });
            document.getElementById('requestsList').innerHTML = reqHtml || 'لا توجد طلبات معلقة.';

            let supHtml = '';
            data.supportMessages.forEach(m => {
                supHtml += `<div class="box"><strong>${m.senderName}:</strong> ${m.content}</div>`;
            });
            document.getElementById('supportList').innerHTML = supHtml || 'لا توجد رسائل دعم.';
        }
        async function approve(id) {
            await fetch('https://earn-uq8k.onrender.com/api/admin/approve-update', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ requestId: id })
            });
            alert('تمت الموافقة بنجاح!');
            loadAdminData();
        }
        loadAdminData();
    </script>
</body>
</html>
