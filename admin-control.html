<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Admin Control Panel</title>
    <style>
        * { box-sizing: border-box; font-family: monospace, sans-serif; margin: 0; padding: 0; }
        body { background: #000; color: #fff; padding: 20px; }
        h1 { border-bottom: 2px solid #fff; padding-bottom: 10px; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #fff; padding: 10px; text-align: right; font-size: 0.85rem; }
        th { background: #111; }
        input { background: #000; border: 1px solid #fff; color: #fff; padding: 5px; width: 90px; }
        .btn-action { background: #fff; color: #000; border: none; padding: 5px 10px; cursor: pointer; font-weight: bold; }
        .btn-action:hover { background: #aaa; }
        .banned { color: red; }
    </style>
</head>
<body>
    <h1>لوحة التحكم التنفيذية - إدارة الأعضاء</h1>
    <table>
        <thead>
            <tr>
                <th>المستخدم</th>
                <th>البريد الإلكتروني</th>
                <th>كلمة السر الحالية</th>
                <th>الرصيد (BFP)</th>
                <th>الحالة</th>
                <th>إجراءات</th>
            </tr>
        </thead>
        <tbody id="usersTable"></tbody>
    </table>

    <script>
        const API_URL = 'https://earn-uq8k.onrender.com/api';

        async function loadUsers() {
            const res = await fetch(`${API_URL}/admin/users`);
            const data = await res.json();
            if (data.success) {
                const tbody = document.getElementById('usersTable');
                tbody.innerHTML = '';
                data.users.forEach(u => {
                    tbody.innerHTML += `
                        <tr>
                            <td>${u.username}</td>
                            <td>${u.email}</td>
                            <td><input type="text" id="pass-${u._id}" value="${u.password}"></td>
                            <td><input type="number" step="0.01" id="bal-${u._id}" value="${u.dashboardData.balance}"></td>
                            <td class="${u.dashboardData.isBanned ? 'banned' : ''}">${u.dashboardData.isBanned ? 'محظور' : 'نشط'}</td>
                            <td>
                                <button class="btn-action" onclick="updateUser('${u._id}')">حفظ</button>
                                <button class="btn-action" onclick="toggleBan('${u._id}', ${!u.dashboardData.isBanned})">${u.dashboardData.isBanned ? 'إلغاء الحظر' : 'حظر'}</button>
                            </td>
                        </tr>
                    `;
                });
            }
        }

        async function updateUser(userId) {
            const balance = parseFloat(document.getElementById(`bal-${userId}`).value);
            const password = document.getElementById(`pass-${userId}`).value;

            const res = await fetch(`${API_URL}/admin/update-user/${userId}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ balance, password })
            });
            const data = await res.json();
            alert(data.message);
            loadUsers();
        }

        async function toggleBan(userId, isBanned) {
            await fetch(`${API_URL}/admin/update-user/${userId}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ isBanned })
            });
            loadUsers();
        }

        loadUsers();
    </script>
</body>
</html>
