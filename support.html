<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8"><title>الدعم الفني</title>
    <style>body{background:#121212;color:#fff;font-family:Tahoma;padding:40px;text-align:center;} form{max-width:350px;margin:auto;background:#1e1e1e;padding:20px;border-radius:8px;} textarea,button{width:100%;padding:10px;margin:10px 0;background:#2a2a2a;color:#fff;border:1px solid #444;} button{background:#d4af37;color:#121212;font-weight:bold;cursor:pointer;}</style>
</head>
<body>
    <h2>الدعم الفني والشكاوى</h2>
    <form id="supportForm">
        <textarea id="content" rows="5" placeholder="اكتب رسالتك للإدارة هنا..." required></textarea>
        <button type="submit">إرسال الإرسالية</button>
    </form>
    <p id="msg"></p>
    <a href="dashboard.html" style="color:#d4af37;">العودة للوحة التحكم</a>
    <script>
        const user = JSON.parse(localStorage.getItem('currentUser'));
        document.getElementById('supportForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const res = await fetch('https://earn-uq8k.onrender.com/api/support', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ userId: user._id, senderName: user.username, content: document.getElementById('content').value })
            });
            const data = await res.json();
            document.getElementById('msg').textContent = data.message;
        });
    </script>
</body>
</html>
