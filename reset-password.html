<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - The BlackFlower</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .auth-container {
            max-width: 400px;
            margin: 50px auto;
            border: 2px solid #ffffff;
            background-color: #000000;
            padding: 30px;
        }
        .auth-container h2 {
            text-transform: uppercase;
            letter-spacing: 2px;
            text-align: center;
            margin-bottom: 25px;
            color: #fff;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 20px;
        }
        .form-group label {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: bold;
        }
        .form-group input {
            background: #000;
            border: 1px solid #fff;
            color: #fff;
            padding: 12px;
            font-family: inherit;
        }
        .form-group input:focus {
            outline: none;
            border-color: #ff00ff;
        }
        .auth-links {
            text-align: center;
            margin-top: 15px;
        }
        .auth-links a {
            color: #00ff77;
            text-decoration: none;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="auth-container">
            <h2>Reset Password</h2>
            <form id="resetForm">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="name@example.com" required>
                </div>
                <div class="form-group">
                    <label for="newPassword">New Password</label>
                    <input type="password" id="newPassword" placeholder="••••••••" required>
                </div>
                <button type="submit" id="submitBtn" class="btn-blackflower" style="width: 100%; border-color: #ff00ff; color: #ff00ff;">Update Password</button>
            </form>
            <div class="auth-links">
                <p><a href="login.html">Back to Login</a></p>
            </div>
        </div>
    </div>

    <script>
        // ⚠️ استبدل الرابط أدناه برابط سيرفرك الحقيقي على Render
        const API_URL = 'https://your-backend-url.com/api';

        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.innerText = "UPDATING...";

            const email = document.getElementById('email').value;
            const newPassword = document.getElementById('newPassword').value;

            try {
                const response = await fetch(`${API_URL}/reset-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, newPassword })
                });

                const result = await response.json();

                if (!result.success) {
                    throw new Error(result.message || 'Failed to update password');
                }

                alert('Password updated successfully! Please login with your new password.');
                window.location.href = 'login.html';

            } catch (error) {
                alert('Error: ' + error.message);
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = "Update Password";
            }
        });
    </script>
</body>
</html>
