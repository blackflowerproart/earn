<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - The BlackFlower Pro Art</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: monospace, sans-serif; }
        body { background-color: #000; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .auth-card { border: 2px solid #fff; background: #000; padding: 40px; width: 100%; max-width: 400px; text-align: center; }
        h1 { text-transform: uppercase; letter-spacing: 2px; margin-bottom: 25px; font-size: 1.3rem; }
        .form-group { margin-bottom: 20px; text-align: left; }
        label { display: block; font-size: 0.8rem; text-transform: uppercase; margin-bottom: 5px; color: #aaa; }
        input { width: 100%; background: #000; border: 1px solid #fff; color: #fff; padding: 12px; font-size: 1rem; outline: none; }
        .btn-submit { width: 100%; background: #fff; color: #000; border: 1px solid #fff; padding: 12px; font-weight: bold; text-transform: uppercase; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        .btn-submit:hover { background: #000; color: #fff; }
        .auth-links { margin-top: 20px; font-size: 0.8rem; }
        .auth-links a { color: #fff; text-decoration: underline; }
        #message { margin-top: 15px; font-size: 0.85rem; }
    </style>
</head>
<body>

    <div class="auth-card">
        <h1>Reset Password</h1>
        <form id="resetForm">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" required>
            </div>
            <div class="form-group">
                <label>New Password</label>
                <input type="password" id="newPassword" required>
            </div>
            <button type="submit" class="btn-submit">Update Password</button>
        </form>
        <div id="message"></div>
        <div class="auth-links">
            <a href="login.html">Back to Login</a>
        </div>
    </div>

    <script>
        const API_URL = 'https://earn-uq8k.onrender.com/api';

        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const newPassword = document.getElementById('newPassword').value;
            const msg = document.getElementById('message');

            msg.innerText = 'Updating...';

            try {
                const res = await fetch(`${API_URL}/reset-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, newPassword })
                });
                const data = await res.json();

                if (res.ok && data.success) {
                    msg.innerText = 'Password updated successfully! Redirecting...';
                    setTimeout(() => window.location.href = 'login.html', 1500);
                } else {
                    msg.innerText = data.message || 'Operation failed.';
                }
            } catch (err) {
                msg.innerText = 'Server connection error.';
            }
        });
    </script>
</body>
</html>
